name: Build macOS Release

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions web tab
    inputs:
      publish:
        description: 'Also publish the .dmg to dist-packages/ and version.json'
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write # only used by the publish step below

jobs:
  build-macos:
    # Apple Silicon runner; the universal build below also produces the Intel half
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm test

      - name: Run Backend Tests (macOS)
        working-directory: src-tauri
        run: cargo test --lib

      # One .dmg that runs natively on both Apple Silicon and Intel Macs.
      # Ad-hoc signed ("-" in tauri.conf.json): no Apple Developer account, so it is NOT
      # notarized and first-time users get the "unidentified developer" prompt (see README).
      - name: Build universal macOS app and .dmg
        run: npx tauri build --target universal-apple-darwin

      - name: Rename .dmg for the update manifest
        run: |
          set -e
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n 1)
          version=$(node -p "require('./package.json').version")
          mkdir -p out
          cp "$dmg" "out/Lyncost_${version}_universal.dmg"
          (cd out && shasum -a 256 "Lyncost_${version}_universal.dmg" | tee SHA256SUMS-macos.txt)

      # Opens the real .dmg, copies the app out, launches it and proves it works:
      #  - process stays alive (no startup crash)
      #  - database is created and fully migrated (Rust side)
      #  - startup backup appears (only if the WebView + CSP + IPC reached the backend)
      - name: Smoke Test Built App
        run: |
          set -e
          dmg=$(ls out/*.dmg | head -n 1)
          hdiutil attach "$dmg" -nobrowse -mountpoint /tmp/lyncost-dmg
          cp -R /tmp/lyncost-dmg/Lyncost.app /tmp/Lyncost.app
          hdiutil detach /tmp/lyncost-dmg
          file /tmp/Lyncost.app/Contents/MacOS/lyncost
          codesign -dv /tmp/Lyncost.app 2>&1 | head -5 || true
          /tmp/Lyncost.app/Contents/MacOS/lyncost > /tmp/lyncost.log 2>&1 &
          pid=$!
          sleep 30
          screencapture -x smoke-test-screenshot.png || true
          if ! kill -0 $pid 2>/dev/null; then echo "Lyncost exited early"; cat /tmp/lyncost.log; exit 1; fi
          dataDir="$HOME/Library/Application Support/com.lyncost.desktop"
          db="$dataDir/lyncost.db"
          test -f "$db" || { echo "Database was not created at $db"; ls -la "$dataDir" || true; exit 1; }
          version=$(python3 -c "import sqlite3,sys; print(sqlite3.connect(sys.argv[1]).execute('SELECT MAX(version) FROM schema_migrations').fetchone()[0])" "$db")
          echo "Schema version: $version"
          [ "$version" -ge 8 ] || { echo "Migrations incomplete (schema version $version)"; exit 1; }
          ls "$dataDir/backups"/*.db > /dev/null 2>&1 || { echo "No startup backup found: frontend did not reach the backend (WebView/CSP/IPC problem)"; exit 1; }
          echo "Startup backup created"
          kill $pid
          echo "SMOKE TEST PASSED"

      - name: Upload Smoke Test Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Smoke-Test-Screenshot-macOS
          path: smoke-test-screenshot.png
          if-no-files-found: ignore

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lyncost-macOS-Universal
          path: out/*
          if-no-files-found: error
          retention-days: 14

      # Release builds only: a push to main whose commit message starts with "release:", a
      # v* tag, or a manual run with "publish" ticked. Puts the .dmg where the in-app updater
      # and the website expect it, exactly like the Linux and Windows packages:
      #   dist-packages/Lyncost_<version>_universal.dmg + its line in dist-packages/SHA256SUMS
      #   version.json -> "macos_installer"
      # Pushes made with GITHUB_TOKEN never start another workflow run, so this cannot loop.
      - name: Publish .dmg to dist-packages and version.json
        if: >-
          (github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'release:') || startsWith(github.ref, 'refs/tags/v'))) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish)
        run: |
          set -e
          version=$(node -p "require('./package.json').version")
          dmg="Lyncost_${version}_universal.dmg"
          cp "out/$dmg" "/tmp/$dmg"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -f -B main origin/main
          cp "/tmp/$dmg" "dist-packages/$dmg"
          sum=$(shasum -a 256 "dist-packages/$dmg" | awk '{print $1}')
          { grep -v "  ${dmg}\$" dist-packages/SHA256SUMS || true; echo "${sum}  ${dmg}"; } > /tmp/SHA256SUMS
          mv /tmp/SHA256SUMS dist-packages/SHA256SUMS
          python3 - "$version" "$sum" <<'PY'
          import json, sys, datetime
          version, sha = sys.argv[1], sys.argv[2]
          data = json.load(open('version.json', encoding='utf-8'))
          mac = {
              "version": version,
              "release_date": datetime.date.today().isoformat(),
              "dmg_url": f"https://raw.githubusercontent.com/leodarshantech/lyncost/main/dist-packages/Lyncost_{version}_universal.dmg",
              "sha256": sha,
          }
          out = {}
          for k, v in data.items():
              out[k] = mac if k == "macos_installer" else v
              if k == "windows_installer" and "macos_installer" not in data:
                  out["macos_installer"] = mac
          if "macos_installer" not in out:
              out["macos_installer"] = mac
          json.dump(out, open('version.json', 'w', encoding='utf-8'), indent=2, ensure_ascii=False)
          open('version.json', 'a').write("\n")
          PY
          git add "dist-packages/$dmg" dist-packages/SHA256SUMS version.json
          git commit -m "release: macOS universal .dmg ${version}"
          git push origin HEAD:main
