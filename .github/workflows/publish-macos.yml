name: Publish macOS Release

# Takes the .dmg built by "Build macOS Release" and puts it where the in-app updater and the
# website expect it, exactly like the Linux and Windows packages:
#   dist-packages/Lyncost_<version>_universal.dmg + its line in dist-packages/SHA256SUMS
#   version.json -> "macos_installer"
#
# Runs automatically after a successful macOS build of a RELEASE (a push to main whose commit
# message starts with "release:", or a v* tag). It can also be run by hand for an already
# finished build: push a branch named ci-publish-macos that contains a .github/publish-run-id
# file holding the run id of the "Build macOS Release" run to publish.
# Pushes made with GITHUB_TOKEN never start another workflow run, so this cannot loop.

on:
  workflow_run:
    workflows: ['Build macOS Release']
    types: [completed]
  push:
    branches:
      - ci-publish-macos

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (startsWith(github.event.workflow_run.head_commit.message, 'release:') || startsWith(github.event.workflow_run.head_branch, 'v')))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Find the build to publish
        id: run
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          else
            git fetch origin ci-publish-macos
            id=$(git show origin/ci-publish-macos:.github/publish-run-id | tr -d '[:space:]')
            echo "id=$id" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the .dmg artifact
        uses: actions/download-artifact@v4
        with:
          name: Lyncost-macOS-Universal
          path: out
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish .dmg to dist-packages and version.json
        run: |
          set -euo pipefail
          trap 'echo "::error::publish failed (exit $?) at line ${LINENO}: ${BASH_COMMAND}"' ERR
          ls -la out
          dmg_path=$(ls out/Lyncost_*_universal.dmg | head -n 1)
          dmg=$(basename "$dmg_path")
          version=${dmg#Lyncost_}
          version=${version%_universal.dmg}
          echo "Publishing $dmg (version $version)"
          cp "$dmg_path" "dist-packages/$dmg"
          sum=$(sha256sum "dist-packages/$dmg" | awk '{print $1}')
          { grep -v "  ${dmg}\$" dist-packages/SHA256SUMS || true; echo "${sum}  ${dmg}"; } > /tmp/SHA256SUMS
          mv /tmp/SHA256SUMS dist-packages/SHA256SUMS
          python3 - "$version" "$sum" <<'PY'
          import json, sys, datetime
          version, sha = sys.argv[1], sys.argv[2]
          data = json.load(open('version.json', encoding='utf-8'))
          mac = {
              "version": version,
              "release_date": datetime.date.today().isoformat(),
              "dmg_url": f"https://raw.githubusercontent.com/leodarshantech/lyncost/main/dist-packages/Lyncost_{version}_universal.dmg",
              "sha256": sha,
          }
          out = {}
          for k, v in data.items():
              out[k] = mac if k == "macos_installer" else v
              if k == "windows_installer" and "macos_installer" not in data:
                  out["macos_installer"] = mac
          if "macos_installer" not in out:
              out["macos_installer"] = mac
          json.dump(out, open('version.json', 'w', encoding='utf-8'), indent=2, ensure_ascii=False)
          open('version.json', 'a').write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "dist-packages/$dmg" dist-packages/SHA256SUMS version.json
          if git diff --cached --quiet; then echo "Nothing new to publish"; exit 0; fi
          git commit -m "release: macOS universal .dmg ${version}"
          git push origin HEAD:main
