[package]
name = "lyncost"
version = "0.1.10"
description = "Lyncost - 100% Offline, Privacy-First Personal Finance & Investment Tracker"
authors = ["leodarshantech <leodarshantech@users.noreply.github.com>"]
license = "SEE LICENSE IN LICENSE"
repository = "https://github.com/leodarshantech/lyncost"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "lyncost_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "=2.4.0"  # 2.5 requires tauri 2.12; keep runtime in sync with @tauri-apps/api 2.11
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
bcrypt = "0.17"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
ed25519-dalek = "2"

